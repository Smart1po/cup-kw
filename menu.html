<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t-title="menucat.title">cup.kw — every cup we make</title>
<meta name="description" content="Every cup cup.kw makes: the Classic line, the Sadu limited edition, the handled Advanced cup, and the concept editions.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/cup.css">
<link rel="stylesheet" href="assets/css/experience.css">
</head>
<body>

<a class="skip" href="#main" data-t="nav.skip">Skip to content</a>

<header class="top">
  <button type="button" class="burger" data-burger>
    <span class="burger__bars" aria-hidden="true"><i></i><i></i><i></i></span>
    <span data-t="nav.menu">Menu</span>
  </button>
  <a class="mark" href="index.html">cup<b>.kw</b></a>
  <span class="top__end">
    <a class="btn btn--ghost" href="engrave.html" data-t="home.cta">Engrave yours</a>
  </span>
</header>

<main id="main">

  <section class="frame frame--auto">
    <div class="frame__in stack" data-rise>
      <p class="micro" data-t="menucat.label">The menu</p>
      <h1 class="display" data-t="menucat.h1">Every cup we make.</h1>
      <p class="lede" data-t="menucat.sub"></p>
      <p class="micro" data-menu-count></p>
    </div>
  </section>

  <div class="menuwrap">
    <div class="filter" data-filters></div>
    <p class="pending" data-menu-empty hidden data-t="shop.none"></p>
  </div>

  <div class="menuwrap" data-menu></div>

  <div class="tray" data-tray hidden>
    <div class="tray__in">
      <p class="tray__count" data-tray-count></p>
      <button type="button" class="btn btn--ghost" data-tray-clear data-t="shop.clear">Clear</button>
      <a class="btn" href="checkout.html"><span data-t="cart.checkout">Checkout</span><span class="arrow" aria-hidden="true">→</span></a>
    </div>
  </div>

  <section class="frame frame--auto">
    <div class="frame__in stack" data-rise style="justify-items:center;text-align:center">
      <p class="micro" data-t="f.price.label">Reserve</p>
      <h2 class="display display--2" data-t="f.price.h">Costs nothing. Owes nothing.</h2>
      <a class="btn" href="checkout.html">
        <span data-t="cart.checkout">Checkout</span><span class="arrow" aria-hidden="true">→</span>
      </a>
    </div>
  </section>

</main>

<footer class="foot">
  <div class="foot__in">
    <div class="stack" style="gap:.6rem">
      <p class="mark" style="font-size:1.4rem">cup<b>.kw</b></p>
      <p class="micro" data-contact></p>
    </div>
    <p class="micro"><a href="https://github.com/Smart1po/cup-kw" rel="noopener" data-t="foot.source">Source on GitHub</a></p>
  </div>
</footer>

<script src="assets/js/content.js"></script>
<script src="assets/js/catalogue.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/backend.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/menu.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/ui.js"></script>
</body>
</html>
