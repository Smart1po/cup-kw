<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t-title="auth.title">Sign in — cup.kw</title>
<meta name="description" content="Sign in to cup.kw, or create an account, to save your engraving and follow your orders.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/cup.css">
<link rel="stylesheet" href="assets/css/experience.css">
</head>
<body>

<a class="skip" href="#main" data-t="nav.skip">Skip to content</a>

<header class="top">
  <button type="button" class="burger" data-burger>
    <span class="burger__bars" aria-hidden="true"><i></i><i></i><i></i></span>
    <span data-t="nav.menu">Menu</span>
  </button>
  <a class="mark" href="index.html">cup<b>.kw</b></a>
  <span class="top__end"></span>
</header>

<main id="main" class="frame glow">
  <div class="frame__in authlay">

    <figure class="authlay__art" style="margin:0">
      <div data-cup3d data-face="held" data-height="360" aria-label="A three-dimensional model of the cup"></div>
    </figure>

    <div class="authlay__form stack" style="gap:1.3rem;width:100%">
      <p class="micro" data-t="nav.login">Sign in</p>
      <h1 class="display display--2" data-t="auth.h1">Sign in, or make an account.</h1>

      <!-- Two modes, chosen rather than guessed. One button that decides for
           you is how a typo in an address silently becomes a second account. -->
      <div class="authtabs" role="tablist">
        <button type="button" class="authtab is-on" id="tab-in" role="tab"
                aria-selected="true" data-mode="in" data-t="auth.signin">Sign in</button>
        <button type="button" class="authtab" id="tab-up" role="tab"
                aria-selected="false" data-mode="up" data-t="auth.signup">Create account</button>
      </div>

      <p class="notice" id="msg" hidden></p>

      <form id="authform" novalidate style="width:100%">

        <!-- Only asked for when making an account. Hidden in the markup, so a
             sign-in never tabs through four boxes it does not need. -->
        <div class="field" data-signup-only hidden>
          <label for="fullname" data-t="auth.fullname">Full name</label>
          <input id="fullname" name="fullname" type="text" autocomplete="name">
        </div>

        <div class="field">
          <label for="email" data-t="auth.email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="field" data-signup-only hidden>
          <label for="phone" data-t="auth.phone">Phone number</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel">
        </div>

        <div class="field" data-signup-only hidden>
          <label for="area" data-t="auth.area">Area</label>
          <input id="area" name="area" type="text" autocomplete="address-level2">
        </div>

        <div class="field">
          <label for="pw" data-t="auth.password">Password</label>
          <div class="pwwrap">
            <input id="pw" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="pweye" id="pweye" aria-pressed="false"
                    data-t-attr="aria-label:auth.show"></button>
          </div>
          <p class="hint" data-t="auth.pwShort">Never stored here. Only a hash of it is kept, and not by us.</p>
        </div>

        <div style="display:flex;gap:.6rem;flex-wrap:wrap">
          <button type="submit" class="btn" id="submitbtn" data-t="auth.signin">Sign in</button>
        </div>
      </form>

      <p class="author"><span data-t="auth.or">or</span></p>

      <div class="provider">
        <button type="button" class="btn btn--ghost provider__btn" data-oauth="google">
          <svg class="provider__i" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#EA4335" d="M12 10.2v3.9h5.5a4.7 4.7 0 0 1-2 3.1l3.2 2.5c1.9-1.7 3-4.3 3-7.3 0-.7-.1-1.4-.2-2z"/>
            <path fill="#34A853" d="M6.6 14.3 5.9 14l-2.3 1.8A9 9 0 0 0 12 21c2.4 0 4.5-.8 6-2.2l-3.2-2.5c-.8.6-1.9.9-2.8.9-2.4 0-4.4-1.6-5.1-3.8z"/>
            <path fill="#FBBC05" d="M3.6 8.2A9 9 0 0 0 3.6 15.8L6.6 13.5a5.4 5.4 0 0 1 0-3z"/>
            <path fill="#4285F4" d="M12 6.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 3.6 8.2l3 2.3C7.4 8.2 9.5 6.6 12 6.6z"/>
          </svg>
          <span data-t="auth.google">Continue with Google</span>
        </button>
        <button type="button" class="btn btn--ghost provider__btn" data-oauth="apple">
          <svg class="provider__i" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M16.4 12.7c0-2.2 1.8-3.2 1.9-3.3-1-1.5-2.6-1.7-3.2-1.8-1.4-.1-2.7.8-3.3.8-.7 0-1.7-.8-2.8-.8-1.5 0-2.8.8-3.5 2.1-1.5 2.6-.4 6.5 1.1 8.6.7 1 1.6 2.2 2.7 2.1 1.1 0 1.5-.7 2.8-.7s1.7.7 2.8.7c1.2 0 1.9-1 2.6-2.1.8-1.2 1.2-2.3 1.2-2.4-.1 0-2.3-.9-2.3-3.2zM14.3 6.2c.6-.7 1-1.7.9-2.7-.9 0-2 .6-2.6 1.3-.6.6-1.1 1.7-.9 2.6 1 .1 2-.5 2.6-1.2z"/>
          </svg>
          <span data-t="auth.apple">Continue with Apple</span>
        </button>
      </div>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="foot__in">
    <p class="mark" style="font-size:1.4rem">cup<b>.kw</b></p>
    <p class="micro"><a href="https://github.com/Smart1po/cup-kw" rel="noopener" data-t="foot.source">Source on GitHub</a></p>
  </div>
</footer>

<script src="assets/js/content.js"></script>
<script src="assets/js/catalogue.js"></script>
<script src="assets/js/experience.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/backend.js"></script>
<script src="assets/js/cup3d.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/intro.js"></script>
<script src="assets/js/chat.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
